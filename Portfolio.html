<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henry Ton | MIS Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #e2e8f0;
      line-height: 1.6;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid #1e293b;
      background: rgba(11, 18, 32, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
    }

    .hero {
      padding: 85px 0 70px;
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 4.5rem);
      line-height: 1.05;
      color: #f8fafc;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #60a5fa;
    }

    .hero p {
      font-size: 1.08rem;
      color: #cbd5f5;
      margin-bottom: 26px;
      max-width: 700px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid #60a5fa;
    }

    .btn-primary {
      background: #2563eb;
      color: #f8fafc;
    }

    .btn-secondary {
      color: #60a5fa;
    }

    .hero-card {
      background: linear-gradient(145deg, #111827, #020617);
      padding: 26px;
      border-radius: 24px;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .hero-card h3 {
      color: #f8fafc;
      margin-bottom: 14px;
    }

    .quick-stats {
      display: grid;
      gap: 14px;
    }

    .stat {
      background: #020617;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #1e293b;
    }

    .stat strong {
      color: #60a5fa;
      font-size: 1.15rem;
    }

    section {
      padding: 60px 0;
    }

    .section-title {
      font-size: 2rem;
      color: #f8fafc;
      margin-bottom: 14px;
    }

    .section-subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
      max-width: 760px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 22px;
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }

    .card h3 {
      color: #f8fafc;
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5f5;
      margin-bottom: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .tag {
      background: #020617;
      color: #93c5fd;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .project-image {
      width: 100%;
      height: 170px;
      background: #020617;
      border: 1px dashed #334155;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      margin-bottom: 18px;
      text-align: center;
      padding: 15px;
      font-size: 0.92rem;
    }

    .resume-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .resume-item {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 16px;
    }

    .timeline {
      display: grid;
      gap: 18px;
    }

    .timeline-item {
      background: #020617;
      border-left: 4px solid #60a5fa;
      padding: 18px 20px;
      border-radius: 14px;
      border-top: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
      border-bottom: 1px solid #1e293b;
    }

    .timeline-item h3 {
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .timeline-item small {
      color: #94a3b8;
    }

    footer {
      padding: 36px 0;
      text-align: center;
      color: #94a3b8;
      border-top: 1px solid #1e293b;
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .grid, .resume-list {
        grid-template-columns: 1fr;
      }

      nav {
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- content unchanged -->
</body>
</html>
